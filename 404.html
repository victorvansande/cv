<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Pagina niet gevonden · Victor Van Sande</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <link rel="icon" href="/assets/icons/favicon-32.png?v=2" sizes="32x32" type="image/png" />
  <link rel="icon" href="/assets/icons/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#0c0a0a" />
  <!-- Licht of donker, en Nederlands of Engels, zoals de bezoeker op de site
       koos (dezelfde sleutels als index.html: cv-modus en cv-lang). Voor de
       eerste weergave, zodat er niets verspringt. -->
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('cv-modus')==='light'){d.dataset.mode='light';var t=document.querySelector('meta[name=theme-color]');if(t)t.content='#f6f1ea';}if(localStorage.getItem('cv-lang')==='en')d.lang='en';}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Libre+Franklin:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=324" />
  <style>
    .nf { min-height: 100vh; display: grid; align-content: center; padding-block: 48px; }
    .nf-code { font-family: var(--font-head); font-weight: 800; font-size: clamp(6rem, 22vw, 14rem); line-height: .85; color: var(--g-acc); }
    .nf h1 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 600; margin-top: 18px; }
    .nf p { color: var(--g-soft); margin-top: 10px; max-width: 46ch; }
  </style>
</head>
<body class="grade g-eclipse">
  <main class="nf wrap">
    <div class="nf-code">404</div>
    <h1 data-en="This page does not exist">Deze pagina bestaat niet</h1>
    <p data-en="The link may be outdated or mistyped. There is still plenty to see elsewhere on the site.">De link is mogelijk verouderd of verkeerd getypt. Elders op de site valt er wel nog genoeg te bekijken.</p>
    <div class="btn-row">
      <a href="/" class="btn" data-en="Back to home">Terug naar home</a>
    </div>
  </main>
  <!-- Engels als de bezoeker dat op de site koos: de Nederlandse tekst staat
       in de html, de Engelse in data-en -->
  <script>
    if (document.documentElement.lang === "en") {
      document.querySelectorAll("[data-en]").forEach(function (el) { el.textContent = el.dataset.en; });
      document.title = "404 · Page not found · Victor Van Sande";
    }
  </script>
</body>
</html>
